<!doctype html>
<html>
  <head>
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
    <style>
      .form-group {
        width: 100%;
        display: block;
        margin-bottom: 12px;
      }
      .form-group label {
        display: block;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .form-group input {
        width: 100%;
        box-sizing: border-box;
      }
      .buttons {
        padding-top: 14px;
      }
      .save-status {
        display: none;
        margin-top: 10px;
        color: #00c139;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <fieldset>
      <legend data-i18n="settings.title">Modbus Connection</legend>
      <p data-i18n="settings.description">Configure the Modbus TCP connection to your Solis inverter. These settings are shared by all Solis devices.</p>
      <div class="form-group">
        <label for="address" data-i18n="settings.address">IP Address</label>
        <input type="text" id="address" placeholder="0.0.0.0" />
      </div>
      <div class="form-group">
        <label for="port" data-i18n="settings.port">Port</label>
        <input type="number" id="port" placeholder="502" />
      </div>
      <div class="form-group">
        <label for="inverterid" data-i18n="settings.inverterid">Inverter ID</label>
        <input type="number" id="inverterid" placeholder="1" min="0" max="50" />
      </div>
    </fieldset>
    <div class="buttons">
      <button id="save" class="button" data-i18n="settings.save">Save</button>
    </div>
    <p id="save-status" class="save-status" data-i18n="settings.saved">Settings saved.</p>

    <script type="text/javascript">
      function onHomeyReady(Homey) {
        Homey.ready();

        var addressEl = document.getElementById('address');
        var portEl = document.getElementById('port');
        var inverterIdEl = document.getElementById('inverterid');
        var saveEl = document.getElementById('save');
        var statusEl = document.getElementById('save-status');

        // Load existing settings
        Homey.get('address', function (err, value) {
          if (!err && value) addressEl.value = value;
        });
        Homey.get('port', function (err, value) {
          if (!err && value) portEl.value = value;
        });
        Homey.get('inverterid', function (err, value) {
          if (!err && value != null) inverterIdEl.value = value;
        });

        // Save settings
        saveEl.addEventListener('click', function () {
          var address = addressEl.value.trim();
          var port = Number(portEl.value);
          var inverterid = Number(inverterIdEl.value);

          if (!address) {
            return Homey.alert('Please enter an IP address.');
          }
          if (!port || port <= 0) {
            return Homey.alert('Please enter a valid port number.');
          }

          Homey.set('address', address, function (err) {
            if (err) return Homey.alert(err);
          });
          Homey.set('port', port, function (err) {
            if (err) return Homey.alert(err);
          });
          Homey.set('inverterid', inverterid, function (err) {
            if (err) return Homey.alert(err);
          });

          statusEl.style.display = 'block';
          setTimeout(function () {
            statusEl.style.display = 'none';
          }, 3000);
        });
      }
    </script>
  </body>
</html>
